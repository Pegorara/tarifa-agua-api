services:
  postgres:
    image: postgres:16
    container_name: tarifa-agua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarifa_agua
      POSTGRES_USER: tarifa_user
      POSTGRES_PASSWORD: tarifa_pass
    ports:
      - "5434:5432"
    volumes:
      - tarifa_agua_data:/var/lib/postgresql/data

volumes:
  tarifa_agua_data: